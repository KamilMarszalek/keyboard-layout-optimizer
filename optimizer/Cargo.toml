[package]
name = "optimizer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
any_ascii = "0.3.3"
itertools = "0.14.0"
rand = { version = "0.10.1", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.118"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
rstest = "0.26.1"
